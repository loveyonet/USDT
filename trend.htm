<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OTC 趋势监控 - 完整功能版</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #0b0f19; --card: #161b22; --accent: #58a6ff;
            --upbit: #38bdf8; --bithumb: #fbbf24;
            --text: #c9d1d9; --muted: #8b949e; --up-col: #3fb950; --down-col: #f85149;
        }
        * { box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        
        .header { width: 100%; max-width: 1300px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .header h1 { font-size: 1.1rem; color: var(--accent); margin: 0; }
        #nextUpdate { color: var(--accent); font-weight: bold; font-size: 1.1rem; }

        /* 强制并排布局 */
        .stats-row { display: flex; flex-direction: row; gap: 8px; width: 100%; max-width: 1300px; margin-bottom: 12px; }
        .stat-card { flex: 1; background: var(--card); padding: 12px 5px; border-radius: 10px; border: 1px solid #30363d; text-align: center; min-width: 0; }
        .stat-label { font-size: 0.7rem; color: var(--muted); font-weight: bold; text-transform: uppercase; }
        .stat-val { font-size: 1.4rem; font-weight: 800; font-family: 'Courier New', monospace; color: #fff; margin: 4px 0; }
        .trend-val { font-size: 0.8rem; font-weight: bold; line-height: 1; }

        .chart-container { background: var(--card); width: 100%; max-width: 1300px; height: 45vh; min-height: 300px; padding: 10px; border-radius: 12px; border: 1px solid #30363d; margin-bottom: 15px; }
        
        .controls { width: 100%; max-width: 1300px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; background: #161b22; padding: 12px; border-radius: 10px; border: 1px solid #30363d; }
        .control-group { display: flex; align-items: center; gap: 5px; font-size: 0.85rem; }
        input { background: #0d1117; border: 1px solid #30363d; color: var(--accent); padding: 6px; border-radius: 6px; text-align: center; width: 45px; font-weight: bold; }
        button { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: bold; }

        #historySection { width: 100%; max-width: 1300px; margin-top: 15px; background: var(--card); border-radius: 10px; border: 1px solid #30363d; overflow: hidden; }
        .scroll-box { max-height: 300px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        table { width: 100%; border-collapse: collapse; font-size: 0.75rem; table-layout: fixed; }
        th { background: #0d1117; padding: 10px 2px; color: var(--muted); border-bottom: 1px solid #30363d; }
        td { padding: 10px 2px; border-top: 1px solid #21262d; text-align: center; font-family: monospace; white-space: nowrap; }
        
        .up { color: var(--up-col); } .down { color: var(--down-col); }

        @media (min-width: 768px) {
            .stat-val { font-size: 2.4rem; }
            .stat-label { font-size: 0.9rem; }
            .header h1 { font-size: 1.5rem; }
            .chart-container { height: 400px; }
            table { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

<div class="header">
    <h1>📈 USDT 实时趋势</h1>
    <div><span id="nextUpdate">--:--</span></div>
</div>

<div class="stats-row">
    <div class="stat-card" style="border-top: 4px solid var(--upbit)">
        <div class="stat-label">UPBIT</div>
        <div id="pU" class="stat-val">-</div>
        <div id="tU" class="trend-val">--</div>
    </div>
    <div class="stat-card" style="border-top: 4px solid var(--bithumb)">
        <div class="stat-label">BITHUMB</div>
        <div id="pB" class="stat-val">-</div>
        <div id="tB" class="trend-val">--</div>
    </div>
</div>

<div class="chart-container"><canvas id="trendChart"></canvas></div>

<div class="controls">
    <div class="control-group">
        <span>间隔:</span>
        <input id="freqInput" type="number" value="1" onchange="resetWorker()">
        <span>分</span>
    </div>
    <button onclick="recordPoint()">采样</button>
    <button onclick="exportToExcel()">导出</button>
    <button onclick="clearData()" style="color:var(--down-col)">清空</button>
</div>

<div id="historySection">
    <table>
        <thead>
            <tr>
                <th width="18%">时间</th>
                <th width="22%" style="color:var(--upbit)">Upbit</th>
                <th width="19%">涨跌</th>
                <th width="22%" style="color:var(--bithumb)">Bithumb</th>
                <th width="19%">涨跌</th>
            </tr>
        </thead>
    </table>
    <div class="scroll-box">
        <table><tbody id="logBody"></tbody></table>
    </div>
</div>

<script>
    const STORAGE_KEY = 'otc_trend_final_v2';
    let db = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    let worker = null;

    const ctx = document.getElementById('trendChart').getContext('2d');
    const chart = new Chart(ctx, {
        type: 'line',
        data: { labels: [], datasets: [
            { label: 'Upbit', data: [], borderColor: '#38bdf8', borderWidth: 2, pointRadius: 0, tension: 0.2 },
            { label: 'Bithumb', data: [], borderColor: '#fbbf24', borderWidth: 2, pointRadius: 0, tension: 0.2 }
        ]},
        options: { 
            responsive: true, maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: { legend: { labels: { color: '#8b949e', boxWidth: 10 } } },
            scales: {
                y: { grid: { color: '#21262d' }, ticks: { color: '#8b949e', font: { size: 10 } } },
                x: { grid: { display: false }, ticks: { color: '#8b949e', font: { size: 10 } } }
            }
        }
    });

    async function fetchData() {
        try {
            const [ru, rb] = await Promise.all([
                fetch("https://api.upbit.com/v1/ticker?markets=KRW-USDT").then(r => r.json()),
                fetch("https://api.bithumb.com/public/ticker/USDT_KRW").then(r => r.json())
            ]);
            return { u: ru[0].trade_price, b: parseFloat(rb.data.closing_price) };
        } catch (e) { return null; }
    }

    async function recordPoint() {
        const p = await fetchData();
        if (!p) return;
        const last = db[db.length - 1];
        const entry = {
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            u: p.u, b: p.b
        };
        db.push(entry);
        if (db.length > 2000) db.shift();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
        updateUI(p, last);
    }

    function updateUI(p, last) {
        document.getElementById('pU').innerText = p.u.toLocaleString();
        document.getElementById('pB').innerText = p.b.toLocaleString();
        document.getElementById('tU').innerHTML = getTrendDisplay(p.u, last?.u);
        document.getElementById('tB').innerHTML = getTrendDisplay(p.b, last?.b);
        updateChart();
        renderTable();
    }

    function getTrendDisplay(curr, last) {
        if (!last) return '--';
        const diff = (curr - last).toFixed(1);
        if (diff > 0) return `<span class="up">▲ +${diff}</span>`;
        if (diff < 0) return `<span class="down">▼ ${Math.abs(diff)}</span>`;
        return `<span style="color:gray">0.0</span>`;
    }

    function renderTable() {
        const body = document.getElementById('logBody');
        body.innerHTML = '';
        [...db].reverse().slice(0, 60).forEach((d, i, arr) => {
            const lastD = arr[i+1];
            const row = body.insertRow();
            row.innerHTML = `
                <td width="18%">${d.time}</td>
                <td width="22%" style="font-weight:bold">${d.u.toLocaleString()}</td>
                <td width="19%">${getTrendDisplay(d.u, lastD?.u)}</td>
                <td width="22%" style="font-weight:bold">${d.b.toLocaleString()}</td>
                <td width="19%">${getTrendDisplay(d.b, lastD?.b)}</td>
            `;
        });
    }

    function updateChart() {
        const slice = db.slice(-100);
        chart.data.labels = slice.map(d => d.time);
        chart.data.datasets[0].data = slice.map(d => d.u);
        chart.data.datasets[1].data = slice.map(d => d.b);
        chart.update('none');
    }

    function resetWorker() {
        if (worker) worker.terminate();
        const mins = parseInt(document.getElementById('freqInput').value) || 1;
        const code = `let t=0; let i=${mins*60}; setInterval(()=>{ t++; postMessage({type:'TICK',s:i-(t%i)}); if(t%i===0){ postMessage({type:'RECORD'}); t=0; } },1000);`;
        worker = new Worker(URL.createObjectURL(new Blob([code])));
        worker.onmessage = (e) => {
            if (e.data.type === 'TICK') {
                const s = e.data.s;
                document.getElementById('nextUpdate').innerText = `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`;
            } else recordPoint();
        };
    }

    function exportToExcel() {
        let csv = "\uFEFF时间,Upbit,Bithumb\n";
        db.forEach(d => csv += `${d.time},${d.u},${d.b}\n`);
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
        a.download = `OTC_Trend.csv`; a.click();
    }

    function clearData() { if(confirm("清空？")) { localStorage.removeItem(STORAGE_KEY); db=[]; location.reload(); } }

    if(db.length > 0) { updateChart(); renderTable(); }
    recordPoint();
    resetWorker();
</script>
</body>
</html>
