<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>USDT OTC 报价系统（Grid专业版）</title>

<style>
body{
    background:#0f172a;
    color:#fff;
    font-family:Arial;
    margin:0;
    padding:10px;
    text-align:center;
}

/* =========================
   🔥 核心布局：GRID系统
========================= */
.grid{
    display:grid;

    /* PC默认 4列 */
    grid-template-columns: repeat(4, 1fr);

    gap:10px;
    max-width:1200px;
    margin:0 auto;
}

/* 卡片 */
.box{
    background:#1e293b;
    padding:12px;
    border-radius:10px;
}

/* 输入 */
input, select{
    width:90%;
    padding:8px;
    border-radius:6px;
    border:none;
    text-align:center;
    font-size:15px;
}

/* 数字 */
.price{font-size:18px;color:#22c55e;}
.big{font-size:22px;color:#38bdf8;}

/* 顶部 */
.topBar{
    background:#111827;
    padding:10px;
    margin-bottom:10px;
    border-radius:8px;
    font-size:13px;
}

/* 按钮 */
button{
    padding:6px 12px;
    border-radius:6px;
    border:none;
    cursor:pointer;
    background:#22c55e;
    color:#000;
    font-weight:bold;
}

/* =========================
   📱 平板
========================= */
@media (max-width: 1024px){
    .grid{
        grid-template-columns: repeat(3, 1fr);
    }
}

/* =========================
   📱 手机（重点：仍然并列）
========================= */
@media (max-width: 768px){
    .grid{
        grid-template-columns: repeat(2, 1fr);
    }

    h1{font-size:20px;}
    h2{font-size:16px;}

    input, select{
        font-size:14px;
        padding:6px;
    }

    .price{font-size:16px;}
    .big{font-size:18px;}
}
</style>
</head>

<body>

<h1>USDT OTC 报价系统</h1>

<!-- 顶部 -->
<div class="topBar">
⏳ 倒计时：<span id="countdown">3</span> |
🕒 刷新：<span id="lastUpdate">--</span> |
<button onclick="manualUpdate()">刷新</button>
</div>

<!-- =========================
     市场区
========================= -->
<div class="grid">

<div class="box" onclick="setLockPrice('upbit')">
Upbit<br><div id="upbit" class="price">-</div>
</div>

<div class="box" onclick="setLockPrice('bithumb')">
Bithumb<br><div id="bithumb" class="price">-</div>
</div>

<div class="box">
锁定价格<br>
<input id="lockedPrice" value="1500">
</div>

</div>

<!-- =========================
     U换韩币
========================= -->
<h2>💱 U换韩币</h2>
<div class="grid">

<div class="box">
换钱所报价<br><input id="buyBroker" value="-10">
</div>

<div class="box">
换钱所价格<br><div id="buyBrokerPrice" class="price">-</div>
</div>

<div class="box">
你的报价<br><input id="buyMy" value="-10">
</div>

<div class="box">
客户报价<br><div id="buyFinal" class="price">-</div>
</div>

</div>

<!-- =========================
     韩币换U
========================= -->
<h2>💱 韩币换U</h2>
<div class="grid">

<div class="box">
换钱所报价<br><input id="sellBroker" value="10">
</div>

<div class="box">
换钱所价格<br><div id="sellBrokerPrice" class="price">-</div>
</div>

<div class="box">
你的报价<br><input id="sellMy" value="10">
</div>

<div class="box">
客户报价<br><div id="sellFinal" class="price">-</div>
</div>

</div>


<!-- =========================
     客户交易
========================= -->
<h2>💰 客户交易</h2>

<div class="grid">

<div class="box">
模式<br>
<select id="mode">
<option value="buy">U换韩币</option>
<option value="sell">韩币换U</option>
</select>
</div>

<div class="box">
KRW（万）<br>
<input id="krwAmount" value="5000">
</div>

<div class="box">
USDT<br>
<input id="usdtAmount" value="1000">
</div>

<div class="box">
结果<br>
<div id="result" class="big">-</div>
</div>

<div class="box">
利润<br>
<div id="profit" class="big">-</div>
</div>

</div>

<script>

let count = 3;
let lock = false;
let lastInput = "krw";

/* ========= 格式统一 ========= */
function fmt(n){
    n = Number(n);
    if(n % 1 === 0) return n.toFixed(0);
    return n.toFixed(2);
}

function fmtWan(n){
    let v = n/10000;
    if(v % 1 === 0) return v.toFixed(0)+"万";
    return v.toFixed(2)+"万";
}

/* ========= API ========= */
async function getUpbit(){
    let r = await fetch("https://api.upbit.com/v1/ticker?markets=KRW-USDT");
    let d = await r.json();
    return d[0].trade_price;
}

async function getBithumb(){
    let r = await fetch("https://api.bithumb.com/public/ticker/USDT_KRW");
    let d = await r.json();
    return parseFloat(d.data.closing_price);
}

/* ========= 锁价 ========= */
function setLockPrice(type){
    if(type==="upbit") lockedPrice.value = upbit.innerText;
    if(type==="bithumb") lockedPrice.value = bithumb.innerText;
    update();
}

function getLocked(){
    return parseFloat(lockedPrice.value)||0;
}

/* ========= 更新 ========= */
async function update(){

    let u = await getUpbit();
    let b = await getBithumb();

    upbit.innerText = fmt(u);
    bithumb.innerText = fmt(b);

    let locked = getLocked();

    let sellFinalVal = locked + (+sellBroker.value||0) + (+sellMy.value||0);
    let buyFinalVal  = locked + (+buyBroker.value||0) + (+buyMy.value||0);

    sellBrokerPrice.innerText = fmt(locked + (+sellBroker.value||0));
    sellFinal.innerText = fmt(sellFinalVal);

    buyBrokerPrice.innerText = fmt(locked + (+buyBroker.value||0));
    buyFinal.innerText = fmt(buyFinalVal);

    let krw = (+krwAmount.value||0)*10000;

    if(!lock){
        lock = true;

        if(lastInput==="krw"){
            usdtAmount.value = (krw / sellFinalVal).toFixed(2);
        }else{
            krwAmount.value = ((+usdtAmount.value * sellFinalVal)/10000).toFixed(2);
        }

        lock = false;
    }

    krw = (+krwAmount.value||0)*10000;

    let mode = modeEl.value;

    let profitUSDT = 0;
    let profitKRW = 0;

    if(mode==="sell"){
        let user = krw / sellFinalVal;
        let real = krw / (locked + (+sellBroker.value||0));

        profitUSDT = real - user;
        profitKRW = profitUSDT * locked;

        result.innerText = fmt(user)+" USDT";

    }else{
        let user = krw / buyFinalVal;
        let real = krw / (locked + (+buyBroker.value||0));

        profitUSDT = user - real;
        profitKRW = profitUSDT * locked;

        result.innerText = fmtWan(krw);
    }

    profit.innerText = fmt(profitUSDT)+" U / "+fmtWan(profitKRW);

    lastUpdate.innerText = new Date().toLocaleString();

    count = 3;
    countdown.innerText = count;
}

/* ========= DOM ========= */
const sellBroker = document.getElementById("sellBroker");
const sellMy = document.getElementById("sellMy");
const buyBroker = document.getElementById("buyBroker");
const buyMy = document.getElementById("buyMy");

const krwAmount = document.getElementById("krwAmount");
const usdtAmount = document.getElementById("usdtAmount");

const result = document.getElementById("result");
const profit = document.getElementById("profit");

const upbit = document.getElementById("upbit");
const bithumb = document.getElementById("bithumb");
const lockedPrice = document.getElementById("lockedPrice");
const modeEl = document.getElementById("mode");

const countdown = document.getElementById("countdown");
const lastUpdate = document.getElementById("lastUpdate");

/* ========= events ========= */
krwAmount.oninput = ()=>{ lastInput="krw"; update(); };
usdtAmount.oninput = ()=>{ lastInput="usdt"; update(); };

["sellBroker","sellMy","buyBroker","buyMy","lockedPrice","mode"]
.forEach(id=>{
    document.getElementById(id).oninput = update;
});

setInterval(()=>{
    count--;
    countdown.innerText = count;
    if(count<=0) update();
},1000);

update();

</script>

</body>
</html>
