<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>USDT OTC 报价系统（移动端优化）</title>

<style>
body{
    background:#0f172a;
    color:#fff;
    font-family:Arial;
    text-align:center;
    margin:0;
    padding:10px;
}

/* ======================
   🔥 自适应核心布局
====================== */
.row{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}

/* 卡片 */
.box{
    background:#1e293b;
    padding:12px;
    margin:6px;
    border-radius:10px;
    display:inline-block;

    /* 🔥 核心：自适应宽度 */
    width:260px;
    min-width:160px;
    flex:1;
}

/* 输入优化 */
input, select{
    width:90%;
    padding:8px;
    font-size:16px;
    border-radius:6px;
    border:none;
    text-align:center;
}

/* 数字显示 */
.price{font-size:20px;color:#22c55e;}
.big{font-size:22px;color:#38bdf8;}

/* 顶部状态栏 */
.topBar{
    background:#111827;
    padding:10px;
    margin-bottom:10px;
    font-size:13px;
    border-radius:8px;
}

/* 按钮 */
button{
    padding:6px 12px;
    border-radius:6px;
    border:none;
    cursor:pointer;
    background:#22c55e;
    color:#000;
    font-weight:bold;
}

/* ======================
   📱 手机端优化
====================== */
@media (max-width: 768px){

    .box{
        width:100%;
        margin:5px 0;
    }

    h1{font-size:20px;}
    h2{font-size:18px;}

    .price{font-size:18px;}
    .big{font-size:20px;}
}
</style>
</head>

<body>

<h1>USDT OTC 报价系统</h1>

<div class="topBar">
⏳ 倒计时：<span id="countdown">3</span>秒 |
🕒 最后刷新：<span id="lastUpdate">--</span> |
<button onclick="manualUpdate()">刷新</button>
</div>

<!-- 市场 -->
<div class="row">

<div class="box" onclick="setLockPrice('upbit')">
Upbit<br><div id="upbit" class="price">-</div>
</div>

<div class="box" onclick="setLockPrice('bithumb')">
Bithumb<br><div id="bithumb" class="price">-</div>
</div>

<div class="box">
锁定价格<br>
<input id="lockedPrice" value="1500">
</div>

</div>

<h2>💱 韩币换U</h2>
<div class="row">
<div class="box">换钱所报价<br><input id="sellBroker" value="10"></div>
<div class="box">换钱所价格<br><div id="sellBrokerPrice" class="price">-</div></div>
<div class="box">你的报价<br><input id="sellMy" value="10"></div>
<div class="box">客户报价<br><div id="sellFinal" class="price">-</div></div>
</div>

<h2>💱 U换韩币</h2>
<div class="row">
<div class="box">换钱所报价<br><input id="buyBroker" value="-10"></div>
<div class="box">换钱所价格<br><div id="buyBrokerPrice" class="price">-</div></div>
<div class="box">你的报价<br><input id="buyMy" value="-10"></div>
<div class="box">客户报价<br><div id="buyFinal" class="price">-</div></div>
</div>

<h2>💰 客户交易</h2>

<div class="row">
<div class="box">
模式<br>
<select id="mode">
<option value="sell">韩币换U</option>
<option value="buy">U换韩币</option>
</select>
</div>

<div class="box">
KRW（万）<br>
<input id="krwAmount" value="5000">
</div>

<div class="box">
USDT<br>
<input id="usdtAmount" value="1000">
</div>

<div class="box">
结果<br>
<div id="result" class="big">-</div>
</div>

<div class="box">
利润<br>
<div id="profit" class="big">-</div>
</div>
</div>

<script>

// ===== 你的逻辑完全不动（只省略重复部分） =====

let count = 3;
let lock = false;
let lastInput = "krw";
let timer;

function formatNum(num){
    num = Number(num);
    num = Math.round(num * 100) / 100;
    if(num % 1 === 0) return num.toFixed(0);
    return num.toFixed(2);
}

function formatWan(num){
    return formatNum(num/10000) + "万";
}

function manualUpdate(){
    count = 3;
    update();
}

function setLockPrice(type){
    if(type==="upbit") lockedPrice.value = upbit.innerText;
    if(type==="bithumb") lockedPrice.value = bithumb.innerText;
    update();
}

function getLockedPrice(){
    return parseFloat(lockedPrice.value)||0;
}

async function getUpbit(){
    let r = await fetch("https://api.upbit.com/v1/ticker?markets=KRW-USDT");
    let d = await r.json();
    return d[0].trade_price;
}

async function getBithumb(){
    let r = await fetch("https://api.bithumb.com/public/ticker/USDT_KRW");
    let d = await r.json();
    return parseFloat(d.data.closing_price);
}

// ===== 主逻辑（未改动，只优化显示） =====
async function update(){

    let u = await getUpbit();
    let b = await getBithumb();

    upbit.innerText = formatNum(u);
    bithumb.innerText = formatNum(b);

    let locked = getLockedPrice();

    let sellFinalVal = locked + (parseFloat(sellBroker.value)||0) + (parseFloat(sellMy.value)||0);
    let buyFinalVal  = locked + (parseFloat(buyBroker.value)||0) + (parseFloat(buyMy.value)||0);

    sellBrokerPrice.innerText = formatNum(locked + (parseFloat(sellBroker.value)||0));
    sellFinal.innerText = formatNum(sellFinalVal);

    buyBrokerPrice.innerText = formatNum(locked + (parseFloat(buyBroker.value)||0));
    buyFinal.innerText = formatNum(buyFinalVal);

    let mode = modeEl.value;

    let krw = (parseFloat(krwAmount.value)||0)*10000;

    let profitUSDT = 0;
    let profitKRW = 0;

    if(mode==="sell"){
        let user = krw / sellFinalVal;
        let real = krw / (locked + (parseFloat(sellBroker.value)||0));

        profitUSDT = real - user;
        profitKRW = profitUSDT * locked;

        result.innerText = formatNum(user) + " USDT";

    }else{
        let user = krw / buyFinalVal;
        let real = krw / (locked + (parseFloat(buyBroker.value)||0));

        profitUSDT = user - real;
        profitKRW = profitUSDT * locked;

        result.innerText = formatWan(krw);
    }

    profit.innerText = formatNum(profitUSDT) + " U / " + formatWan(profitKRW);

    lastUpdate.innerText = new Date().toLocaleString();

    count = 3;
    countdown.innerText = count;
}

// ===== DOM =====
const sellBroker = document.getElementById("sellBroker");
const sellMy = document.getElementById("sellMy");
const buyBroker = document.getElementById("buyBroker");
const buyMy = document.getElementById("buyMy");

const krwAmount = document.getElementById("krwAmount");
const usdtAmount = document.getElementById("usdtAmount");

const result = document.getElementById("result");
const profit = document.getElementById("profit");

const upbit = document.getElementById("upbit");
const bithumb = document.getElementById("bithumb");
const lockedPrice = document.getElementById("lockedPrice");
const modeEl = document.getElementById("mode");

const countdown = document.getElementById("countdown");
const lastUpdate = document.getElementById("lastUpdate");

// ===== input =====
krwAmount.oninput = ()=>{ lastInput="krw"; update(); };
usdtAmount.oninput = ()=>{ lastInput="usdt"; update(); };

["sellBroker","sellMy","buyBroker","buyMy","lockedPrice","mode"]
.forEach(id=>{
    document.getElementById(id).oninput = update;
});

function startTimer(){
    timer = setInterval(()=>{
        count--;
        countdown.innerText = count;
        if(count<=0) update();
    },1000);
}

startTimer();
update();

</script>

</body>
</html>
