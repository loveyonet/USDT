<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USDT OTC 报价系统</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --accent: #38bdf8;
            --success: #22c55e;
            --warning: #fbbf24;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            background: var(--bg-main);
            color: var(--text-main);
            font-family: -apple-system, sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .topBar {
            background: #111827;
            padding: 10px 20px;
            border-radius: 50px;
            margin-bottom: 15px;
            font-size: 12px;
            display: flex;
            gap: 15px;
            border: 1px solid #334155;
        }
        .topBar span { color: var(--accent); font-weight: bold; }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
            gap: 15px;
            width: 100%;
            max-width: 1100px;
        }

        .card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid #334155;
        }

        h2 { font-size: 1rem; margin: 0 0 15px 0; color: var(--accent); border-bottom: 1px solid #334155; padding-bottom: 8px;}
        
        .box { background: #2d3a4f; padding: 12px; border-radius: 8px; text-align: center; margin-bottom: 10px; }
        .label { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
        .price-display { font-size: 1.1rem; font-weight: bold; padding: 4px; border-radius: 4px; margin: 5px 0; }
        
        /* 价格层级颜色 */
        .broker-res { background: rgba(251, 191, 36, 0.1); color: var(--warning); border: 1px solid rgba(251, 191, 36, 0.3); }
        .final-res { background: rgba(34, 197, 94, 0.1); color: var(--success); border: 1px solid rgba(34, 197, 94, 0.3); }
        .arrow { font-size: 12px; color: var(--text-muted); margin: 2px 0; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        input, select {
            width: 85%;
            background: #0f172a;
            border: 1px solid #475569;
            color: white;
            padding: 8px;
            border-radius: 6px;
            text-align: center;
            font-size: 1rem;
        }

        .highlight { color: var(--warning); font-size: 1.4rem; font-weight: bold; }
        button { background: var(--success); border: none; border-radius: 4px; padding: 4px 12px; cursor: pointer; font-weight: bold; }

        @media (max-width: 400px) { .container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<h1 style="font-size: 1.3rem; margin: 10px 0;">USDT OTC 报价系统</h1>

<div class="topBar">
    <div>⏳ <span><span id="countdown">3</span>s</span></div>
    <div>🕒 <span id="lastUpdate">--</span></div>
    <button onclick="update()">刷新</button>
</div>

<div class="container">
    <div class="card">
        <h2>📊 实时基准价</h2>
        <div class="grid-2">
            <div class="box" onclick="setLockPrice('upbit')" style="cursor:pointer">
                <div class="label">Upbit (点击锁定)</div>
                <div id="upbit" class="price-display" style="color:var(--accent)">-</div>
            </div>
            <div class="box" onclick="setLockPrice('bithumb')" style="cursor:pointer">
                <div class="label">Bithumb (点击锁定)</div>
                <div id="bithumb" class="price-display" style="color:var(--accent)">-</div>
            </div>
        </div>
        <div class="box">
            <div class="label">锁定基准价</div>
            <input id="lockedPrice" type="number" value="1450">
        </div>
    </div>

    <div class="card">
        <h2>🛠 报价加点链</h2>
        <div class="grid-2">
            <div class="box">
                <div class="label" style="color:var(--success)">韩币换U (卖U)</div>
                <input id="sellBroker" type="number" value="10" placeholder="换钱所点数">
                <div class="arrow">↓</div>
                <div id="sellBrokerPrice" class="price-display broker-res">-</div>
                <div class="arrow">↓ + 我的利润点</div>
                <input id="sellMy" type="number" value="10" placeholder="我的利润">
                <div class="arrow">↓</div>
                <div id="sellFinalPrice" class="price-display final-res">-</div>
            </div>

            <div class="box">
                <div class="label" style="color:var(--accent)">U换韩币 (买U)</div>
                <input id="buyBroker" type="number" value="-10" placeholder="换钱所点数">
                <div class="arrow">↓</div>
                <div id="buyBrokerPrice" class="price-display broker-res">-</div>
                <div class="arrow">↓ + 我的利润点</div>
                <input id="buyMy" type="number" value="-10" placeholder="我的利润">
                <div class="arrow">↓</div>
                <div id="buyFinalPrice" class="price-display final-res">-</div>
            </div>
        </div>
    </div>

    <div class="card">
        <h2>💰 交易计算器</h2>
        <div class="grid-2">
            <div class="box">
                <div class="label">当前模式</div>
                <select id="mode">
                    <option value="sell">韩币换U</option>
                    <option value="buy">U换韩币</option>
                </select>
            </div>
            <div class="box">
                <div class="label">执行价格</div>
                <div id="finalPriceDisplay" class="highlight">-</div>
            </div>
        </div>
        <div class="grid-2">
            <div class="box">
                <div class="label">韩币金额 (万)</div>
                <input id="krwAmount" type="number" value="5000">
            </div>
            <div class="box">
                <div class="label">USDT 数量</div>
                <input id="usdtAmount" type="number" value="1000">
            </div>
        </div>
        <div class="box" style="margin-top:10px; border: 1px solid var(--accent); background: #1e293b;">
            <div class="label">利润回报 (U / KRW)</div>
            <div id="profit" style="color: #f472b6; font-weight: bold; font-size: 1.1rem;">-</div>
        </div>
    </div>
</div>

<script>
let count = 3;
let lock = false;
let lastInput = "krw";

function formatNum(num) {
    num = Number(num);
    if (isNaN(num)) return "0";
    return num % 1 === 0 ? num.toFixed(0) : num.toFixed(2);
}

function formatWan(num) { return formatNum(num / 10000) + "万"; }

function setLockPrice(id) {
    document.getElementById('lockedPrice').value = document.getElementById(id).innerText;
    update();
}

async function update() {
    try {
        const [ru, rb] = await Promise.all([
            fetch("https://api.upbit.com/v1/ticker?markets=KRW-USDT").then(r => r.json()),
            fetch("https://api.bithumb.com/public/ticker/USDT_KRW").then(r => r.json())
        ]);
        document.getElementById("upbit").innerText = formatNum(ru[0].trade_price);
        document.getElementById("bithumb").innerText = formatNum(rb.data.closing_price);
    } catch (e) {}

    const locked = parseFloat(document.getElementById("lockedPrice").value) || 0;
    
    // 韩币换U链
    const sB = parseFloat(document.getElementById("sellBroker").value) || 0;
    const sM = parseFloat(document.getElementById("sellMy").value) || 0;
    const sellBrokerPriceVal = locked + sB;
    const sellFinalPriceVal = sellBrokerPriceVal + sM;
    document.getElementById("sellBrokerPrice").innerText = formatNum(sellBrokerPriceVal);
    document.getElementById("sellFinalPrice").innerText = formatNum(sellFinalPriceVal);

    // U换韩币链
    const bB = parseFloat(document.getElementById("buyBroker").value) || 0;
    const bM = parseFloat(document.getElementById("buyMy").value) || 0;
    const buyBrokerPriceVal = locked + bB;
    const buyFinalPriceVal = buyBrokerPriceVal + bM;
    document.getElementById("buyBrokerPrice").innerText = formatNum(buyBrokerPriceVal);
    document.getElementById("buyFinalPrice").innerText = formatNum(buyFinalPriceVal);

    // 计算器
    const mode = document.getElementById("mode").value;
    const currentPrice = mode === "sell" ? sellFinalPriceVal : buyFinalPriceVal;
    const currentBrokerPrice = mode === "sell" ? sellBrokerPriceVal : buyBrokerPriceVal;
    
    document.getElementById("finalPriceDisplay").innerText = formatNum(currentPrice);

    let krw = (parseFloat(document.getElementById("krwAmount").value) || 0) * 10000;
    let usdt = parseFloat(document.getElementById("usdtAmount").value) || 0;

    if (!lock) {
        lock = true;
        if (lastInput === "krw") {
            usdt = krw / currentPrice;
            document.getElementById("usdtAmount").value = formatNum(usdt);
        } else {
            krw = usdt * currentPrice;
            document.getElementById("krwAmount").value = formatNum(krw / 10000);
        }
        lock = false;
    }

    // 利润计算
    let pU = 0;
    if (mode === "sell") {
        pU = (krw / currentBrokerPrice) - (krw / currentPrice);
    } else {
        pU = (krw / currentPrice) - (krw / currentBrokerPrice);
    }
    document.getElementById("profit").innerText = `${formatNum(pU)} U / ${formatWan(pU * locked)}`;
    
    document.getElementById("lastUpdate").innerText = new Date().toLocaleTimeString();
    count = 3;
}

document.getElementById("krwAmount").addEventListener("input", () => { lastInput = "krw"; update(); });
document.getElementById("usdtAmount").addEventListener("input", () => { lastInput = "usdt"; update(); });
["sellBroker", "sellMy", "buyBroker", "buyMy", "lockedPrice", "mode"].forEach(id => {
    document.getElementById(id).addEventListener("input", update);
});

setInterval(() => {
    count--;
    document.getElementById("countdown").innerText = count;
    if (count <= 0) update();
}, 1000);

update();
</script>
</body>
</html>
